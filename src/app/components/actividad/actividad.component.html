<ion-card>
  <ion-card-header>
    <ion-badge [color]="miActividad.dificultad === 'BASICO' ? 'success' : 'warning'">
      {{ miActividad.dificultad }}
    </ion-badge>
    <ion-card-title>{{ miActividad.titulo }}</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <p>{{ miActividad.resumen }}</p>
    <ion-button type="button" (click)="selecionar()">Ver instrucciones</ion-button>
  </ion-card-content>
</ion-card>
